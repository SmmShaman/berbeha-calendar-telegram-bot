app = "berbeha-calendar"
primary_region = "arn"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATABASE_DIR = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "calendar_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
